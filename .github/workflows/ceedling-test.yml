name: Ceedling Test and Code Coverage

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write      # for JUnit-report
  contents: read     # for checkout
  actions: read      # for upload-artifact

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build test container
      run: docker compose build ceedling-tests

    - name: Run Ceedling tests
      run: docker compose run --rm ceedling-tests ceedling test:all

    - name: Run coverage (gcov)
      run: docker compose run --rm ceedling-tests ceedling gcov:all

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: gcov-report
        path: build/artifacts/gcov/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/artifacts/test/
        retention-days: 7

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure()
      with:
        detailed_summary: true
        include_passed: true
        report_paths: "build/artifacts/test/junit_tests_report.xml"

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: build/artifacts/gcov/gcovr/GcovCoverageCobertura.xml
        badge: true
        format: "markdown"
        output: "both"
    - name: Write coverage to Job Summary
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}